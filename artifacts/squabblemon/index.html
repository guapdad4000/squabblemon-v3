  <body>
    <div id="root">
      <div class="first-paint-loader" role="status" aria-label="Loading Squabblemon">
        <img class="first-paint-loader__backdrop" src="%BASE_URL%brand/loading-scenes.webp" alt="" aria-hidden="true" />
        <div class="first-paint-loader__shade" aria-hidden="true"></div>
        <div class="first-paint-loader__glow" aria-hidden="true"></div>
        <img
          class="first-paint-loader__mark"
          src="%BASE_URL%brand/squabblemon-crest.webp"
          width="374"
          height="384"
          alt=""
        />
        <div class="first-paint-loader__rule" aria-hidden="true"><span></span></div>
        <p>Loading the block</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #070707; }
      .first-paint-loader {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        gap: .8rem; overflow: hidden; color: rgba(255,255,255,.78); background:
          radial-gradient(circle at 50% 43%, #241b08 0, #0d0c08 31%, #070707 68%);
        font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .25em; text-transform: uppercase;
      }
      .first-paint-loader > * { position: relative; z-index: 1; }
      .first-paint-loader .first-paint-loader__backdrop { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; z-index: 0; }
      .first-paint-loader .first-paint-loader__shade { position:absolute;inset:0;background:linear-gradient(180deg,#05070b50,#05070b88 50%,#05070bd9),radial-gradient(ellipse at center,transparent 15%,#05070b80); }
      .first-paint-loader__glow {
        position: absolute; width: min(78vw, 25rem); aspect-ratio: 1; border: 1px solid rgba(218,166,56,.12);
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        border-radius: 50%; box-shadow: 0 0 80px rgba(218,166,56,.08), inset 0 0 80px rgba(0,0,0,.7);
      }
      .first-paint-loader__mark {
        position: relative; width: clamp(7.5rem, 28vw, 11rem); height: auto; aspect-ratio: 374 / 384;
        object-fit: contain; filter: drop-shadow(0 1rem 1.5rem rgba(0,0,0,.75));
      }
      .first-paint-loader__rule { width: clamp(7rem, 26vw, 10rem); height: 2px; overflow: hidden; background: rgba(218,166,56,.16); }
      .first-paint-loader__rule span { display: block; width: 45%; height: 100%; background: #d9aa4b; animation: loader-scan 2.4s linear infinite; }
      .first-paint-loader p { margin: 0; }
      @keyframes loader-scan { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
      @media (prefers-reduced-motion: reduce) {
        .first-paint-loader__mark, .first-paint-loader__rule span { animation: none; }
        .first-paint-loader__rule span { width: 100%; opacity: .65; }
      }
    </style>
  </body>
