  <body>
    <div id="root">
      <div class="street-broadcast-loader first-paint-loader" aria-busy="true">
        <img id="first-paint-loading-scene" class="sbl-background" alt="" aria-hidden="true" fetchpriority="high" />
        <div class="sbl-grade" aria-hidden="true"></div>
        <div class="sbl-stage">
          <img src="%BASE_URL%brand/prismatic/logos/squabblemon-wordmark-standard-gold.webp" class="sbl-wordmark" alt="Squabblemon" />
          <img src="%BASE_URL%brand/broadcast/loading/fighters-still.webp" class="sbl-fighters" width="288" height="216" alt="" aria-hidden="true" />
        </div>
        <span class="sbl-status" role="status" aria-live="polite">Loading Squabblemon</span>
      </div>
    </div>
    <script>
      // One random scene per loading episode; React adopts this exact selection.
      // First paint requests stills only. The tiny fighter loop never gates boot.
      (function () {
        var scenes = [
          ['loading-sunset-street', 'sunset-street', 'center 54%', 'center 50%'],
          ['loading-squabblehouse', 'squabblehouse', 'center 48%', 'center 50%'],
          ['loading-fade-park', 'fade-park', 'center 50%', 'center 51%']
        ];
        var last = '';
        try { last = localStorage.getItem('squabblemon:last-loading-scene') || ''; } catch (_) {}
        var candidates = scenes.filter(function (scene) { return scene[0] !== last; });
        var selected = candidates[Math.floor(Math.random() * candidates.length)] || candidates[0];
        var root = document.getElementById('root');
        var loader = root.querySelector('.first-paint-loader');
        root.dataset.bootLoadingScene = selected[0];
        loader.dataset.scene = selected[0];
        loader.style.setProperty('--sbl-portrait-position', selected[2]);
        loader.style.setProperty('--sbl-landscape-position', selected[3]);
        try { localStorage.setItem('squabblemon:last-loading-scene', selected[0]); } catch (_) {}
        var poster = document.getElementById('first-paint-loading-scene');
        poster.onerror = function () { poster.style.visibility = 'hidden'; };
        poster.src = '%BASE_URL%brand/broadcast/loading/' + selected[1] + '.jpg';
        var fighters = loader.querySelector('.sbl-fighters');
        var still = '%BASE_URL%brand/broadcast/loading/fighters-still.webp';
        var animated = '%BASE_URL%brand/broadcast/loading/fighters.webp';
        var motion = matchMedia('(prefers-reduced-motion: reduce)');
        var connection = navigator.connection;
        var timer, failed = false;
        function refresh() {
          clearTimeout(timer);
          fighters.src = still;
          var allowed = !failed && !document.hidden && !motion.matches && document.documentElement.dataset.reduceMotion !== 'true'
            && !(connection && (connection.saveData || ['slow-2g','2g','3g'].includes(connection.effectiveType) || typeof connection.downlink === 'number' && connection.downlink < 1));
          if (allowed) timer = setTimeout(function () { if (loader.isConnected) fighters.src = animated; }, 300);
        }
        fighters.onerror = function () {
          if (fighters.src.endsWith('fighters.webp')) { failed = true; refresh(); }
          else fighters.style.visibility = 'hidden';
        };
        motion.addEventListener('change', refresh);
        document.addEventListener('visibilitychange', refresh);
        if (connection && connection.addEventListener) connection.addEventListener('change', refresh);
        var preference = new MutationObserver(refresh);
        preference.observe(document.documentElement, { attributes: true, attributeFilter: ['data-reduce-motion'] });
        var replacement = new MutationObserver(function () {
          if (loader.isConnected) return;
          clearTimeout(timer);
          motion.removeEventListener('change', refresh);
          document.removeEventListener('visibilitychange', refresh);
          if (connection && connection.removeEventListener) connection.removeEventListener('change', refresh);
          preference.disconnect(); replacement.disconnect();
        });
        replacement.observe(root, { childList: true });
        refresh();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #070707; }
.street-broadcast-loader {
  position: fixed; inset: 0; z-index: 50; min-height: 100dvh;
  overflow: hidden; isolation: isolate; background: #101513; color: #f9eccf;
}
.sbl-background, .sbl-video, .sbl-grade {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}
.sbl-background, .sbl-video { object-fit: cover; object-position: var(--sbl-portrait-position, center); }
.sbl-background { z-index: -3; }
.sbl-video { z-index: -2; opacity: 0; transition: opacity .45s ease; }
.sbl-video[data-playing="true"] { opacity: 1; }
.sbl-grade { z-index: -1; background: radial-gradient(ellipse at center, #080b0b44, #080b0b66 72%, #080b0b99); }
.sbl-stage { position: absolute; left: 50%; top: 50%; width: min(76vw, 540px); transform: translate(-50%, -50%); pointer-events: none; }
.sbl-wordmark { display: block; width: 100%; height: auto; filter: drop-shadow(0 5px 16px #000b); }
.sbl-fighters { position: absolute; top: calc(100% + 16px); left: 50%; width: 84px; height: 63px; transform: translateX(-50%); object-fit: contain; }
.sbl-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (orientation: landscape), (min-width: 768px) {
  .sbl-background, .sbl-video { object-position: var(--sbl-landscape-position, center); }
}
@media (max-height: 420px) and (orientation: landscape) {
  .sbl-stage { width: min(54vw, 430px); }
  .sbl-fighters { top: calc(100% + 10px); width: 72px; height: 54px; }
}
@media (prefers-reduced-motion: reduce) { .sbl-video { display: none; transition: none; } }
html[data-reduce-motion="true"] .sbl-video { display: none; transition: none; }
    </style>
