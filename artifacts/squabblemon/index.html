    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root">
      <div class="first-paint-loader" role="status" aria-label="Loading Squabblemon">
        <div class="first-paint-loader__glow" aria-hidden="true"></div>
        <img
          class="first-paint-loader__mark"
          src="%BASE_URL%brand/squabblemon-wordmark.webp"
          width="720"
          height="478"
          alt=""
        />
        <div class="first-paint-loader__rule" aria-hidden="true"><span></span></div>
        <p>Loading the block</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; background: #070707; }
      .first-paint-loader {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        gap: 14px; overflow: hidden; color: rgba(255,255,255,.62); background:
          radial-gradient(circle at 50% 42%, #241b08 0, #0d0c08 34%, #070707 68%);
        font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .28em; text-transform: uppercase;
      }
      .first-paint-loader__glow {
        position: absolute; width: min(88vw, 580px); aspect-ratio: 1; border: 1px solid rgba(218,166,56,.12);
        border-radius: 50%; box-shadow: 0 0 80px rgba(218,166,56,.08), inset 0 0 80px rgba(0,0,0,.7);
      }
      .first-paint-loader__mark {
        position: relative; width: min(76vw, 430px); height: auto; max-height: 54vh;
        object-fit: contain; filter: drop-shadow(0 18px 26px rgba(0,0,0,.75));
        animation: loader-breathe 1.8s ease-in-out infinite;
      }
      .first-paint-loader__rule { width: min(44vw, 190px); height: 2px; overflow: hidden; background: rgba(218,166,56,.16); }
      .first-paint-loader__rule span { display: block; width: 45%; height: 100%; background: #d9aa4b; animation: loader-scan 1.25s ease-in-out infinite; }
      .first-paint-loader p { margin: 0; }
      @keyframes loader-breathe { 50% { transform: translateY(-3px); filter: drop-shadow(0 18px 32px rgba(218,166,56,.16)); } }
      @keyframes loader-scan { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
      @media (max-width: 520px) { .first-paint-loader__mark { width: min(86vw, 360px); max-height: 48vh; } }
      @media (prefers-reduced-motion: reduce) {
        .first-paint-loader__mark, .first-paint-loader__rule span { animation: none; }
        .first-paint-loader__rule span { width: 100%; opacity: .65; }
      }
    </style>
  </body>
