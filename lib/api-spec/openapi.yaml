openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Squabblemon player and game-loop API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: player
    description: Authenticated player progression
  - name: challenge
    description: Deterministic endless reward challenges
  - name: events
    description: Shared community feedback using the current game session
paths:
  /events/feedback:
    get:
      operationId: listEventFeedback
      tags: [events]
      summary: Read shared player feedback on the Events board
      description: >-
        Available to every signed-in player, including developers using the game.
        Newest first, ordered by saved timestamp and post ID. Opaque keyset
        cursors page through older posts without shifts when new posts arrive.
        Responses contain only public in-game display names and post content.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Shared feedback page, content: { application/json: { schema: { $ref: '#/components/schemas/EventFeedbackPage' } } } }
        '400': { description: Invalid page size or cursor, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '401': { description: Game session expired or absent, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '503': { description: Feedback could not be loaded, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
    post:
      operationId: submitEventFeedback
      tags: [events]
      summary: Save player feedback to the shared Events board
      description: >-
        Uses the existing game session, not a separate feedback account.
        Author, public display name, receipt ID and timestamp are server-derived.
        A retry ID belongs to one author and one trimmed category/message pair;
        identical retries return the saved receipt, changed content returns 409.
        At most 5 new posts per rolling 10 minutes and 20 per rolling 24 hours
        per account. Retries of saved posts do not consume this allowance.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventFeedbackInput' }
      responses:
        '200': { description: Original saved receipt for an identical retry, content: { application/json: { schema: { $ref: '#/components/schemas/EventFeedbackReceipt' } } } }
        '201': { description: Feedback saved, content: { application/json: { schema: { $ref: '#/components/schemas/EventFeedbackReceipt' } } } }
        '400': { description: Invalid input or unsupported fields, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '401': { description: Game session expired or absent, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '403': { description: Cross-origin mutation rejected }
        '409': { description: Retry ID already used for different content, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '413': { description: Request exceeds the JSON parser size limit, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
        '429':
          description: Account posting limit reached
          headers:
            Retry-After:
              description: Seconds until a new submission may be attempted
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackError' }
        '503': { description: Submission could not be confirmed; retry with the same retry ID, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackError' } } } }
  /events/patches:
    get:
      operationId: listPublishedPatches
      tags: [events]
      summary: List the latest 100 published game patches and delivery progress
      security: []
      responses:
        '200':
          description: Published patches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicPatch' }
  /admin/patches:
    get:
      operationId: listAdminPatches
      tags: [events]
      summary: List the latest 100 private patch drafts and publication status
      responses:
        '200':
          description: Patch records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminPatch' }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account }
    post:
      operationId: createAdminPatch
      tags: [events]
      summary: Create a persistent patch draft
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchInput' } } } }
      responses:
        '201':
          description: Created patch draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPatch' }
        '400': { description: Invalid patch draft }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account }
  /admin/patches/{id}:
    put:
      operationId: updateAdminPatch
      tags: [events]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchInput' } } } }
      responses:
        '200':
          description: Updated patch draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPatch' }
        '400': { description: Invalid patch draft }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account or request origin }
        '404': { description: Draft not found }
        '409': { description: Published patches cannot be edited }
  /admin/patches/{id}/preview:
    get:
      operationId: previewAdminPatch
      tags: [events]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Patch draft and exact proposed mail with current audience count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatchPreview' }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account }
        '404': { description: Draft not found }
  /admin/patches/{id}/publish:
    post:
      operationId: publishAdminPatch
      tags: [events]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PatchPublishInput' } } } }
      responses:
        '200':
          description: Published patch, fixed recipient snapshot and first delivery progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPatch' }
        '400': { description: Invalid confirmation version }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account or request origin }
        '404': { description: Draft not found }
        '409': { description: Draft changed or was already published }
  /admin/patches/{id}/deliver:
    post:
      operationId: resumeAdminPatchDelivery
      tags: [events]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Patch delivery progress after one bounded batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPatch' }
        '401': { description: Authentication required }
        '403': { description: Patch administration is not enabled for this account or request origin }
        '404': { description: Published patch not found }
  /social:
    get:
      operationId: getSocialState
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/search:
    get:
      operationId: searchSocialPlayers
      parameters: [{ name: query, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 26 } }]
      responses:
        '200': { description: Up to twelve players matching a public display name or current username prefix, content: { application/json: { schema: { $ref: '#/components/schemas/SocialSearchResult' } } } }
  /social/username:
    patch:
      operationId: updateSocialUsername
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialUsernameInput' } } } }
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/match-opponent/{code}:
    get:
      operationId: getSocialMatchOpponent
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Stored human opponent for an authorized participant, content: { application/json: { schema: { $ref: '#/components/schemas/SocialMatchOpponent' } } } }
  /social/lookup/{code}:
    get:
      operationId: lookupSocialPlayer
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Exact lookup, content: { application/json: { schema: { $ref: '#/components/schemas/SocialLookup' } } } }
  /social/requests:
    post:
      operationId: sendHomieRequest
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialCodeInput' } } } }
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/requests/{id}/respond:
    post:
      operationId: respondHomieRequest
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialResponseInput' } } } }
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/homies/{code}/remove:
    post:
      operationId: removeHomie
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/blocks:
    post:
      operationId: blockSocialPlayer
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SocialCodeInput' } } } }
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/blocks/{code}/remove:
    post:
      operationId: unblockSocialPlayer
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Social state, content: { application/json: { schema: { $ref: '#/components/schemas/SocialState' } } } }
  /social/invitations:
    post:
      operationId: sendFadeInvitation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FadeInvitationInput' } } } }
      responses:
        '200': { description: Invitation, content: { application/json: { schema: { $ref: '#/components/schemas/SocialInvitation' } } } }
  /social/invitations/{id}:
    get:
      operationId: getFadeInvitation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Invitation, content: { application/json: { schema: { $ref: '#/components/schemas/SocialInvitation' } } } }
  /social/invitations/{id}/respond:
    post:
      operationId: respondFadeInvitation
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FadeInvitationResponseInput' } } } }
      responses:
        '200': { description: Invitation, content: { application/json: { schema: { $ref: '#/components/schemas/SocialInvitation' } } } }
  /player/challenges/runs:
    post:
      operationId: startChallengeRun
      tags: [challenge]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeStartInput'
      responses:
        '201': { description: Challenge run, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeRun' } } } }
        '401': { description: Authentication required }
        '409': { description: Active run already exists }
    get:
      operationId: listChallengeRuns
      tags: [challenge]
      responses:
        '200': { description: Challenge history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChallengeRun' } } } } }
  /player/challenges/runs/{runId}/actions:
    post:
      operationId: recordChallengeAction
      tags: [challenge]
      parameters: [{ in: path, name: runId, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeAction' } } } }
      responses:
        '200': { description: Updated run, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeRun' } } } }
        '400': { description: Invalid checkpoint or choice }
  /player/challenges/runs/{runId}/checkpoint:
    post:
      operationId: checkpointChallengeRun
      tags: [challenge]
      parameters: [{ in: path, name: runId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeCheckpointInput'
      responses:
        '200': { description: Saved checkpoint, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeRun' } } } }
        '400': { description: Invalid or non-prefix checkpoint }
  /player/challenges/runs/{runId}/settle:
    post:
      operationId: settleChallengeRun
      tags: [challenge]
      parameters: [{ in: path, name: runId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Settled run, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeRun' } } } } }
  /player/challenges/runs/{runId}/abandon:
    post:
      operationId: abandonChallengeRun
      tags: [challenge]
      parameters: [{ in: path, name: runId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Abandoned run, content: { application/json: { schema: { $ref: '#/components/schemas/ChallengeRun' } } } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Verify the API can reach its database
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable; connection details are never returned
  /deploymentz:
    get:
      operationId: getDeploymentIdentity
      tags: [health]
      summary: Read non-secret deployment identity before guarded verification
      responses:
        "200":
          description: Target-side deployment identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentIdentity"
        "503":
          description: Deployment identity unavailable or internally inconsistent
  /player/bootstrap:
    get:
      operationId: getPlayerBootstrap
      tags: [player]
      summary: Load or provision the authenticated player
      responses:
        "200":
          description: Player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "401":
          description: Authentication required
  /player/story:
    get:
      operationId: getPlayerStory
      tags: [player]
      summary: Load canonical chapter and node progression
      responses:
        "200":
          description: Canonical story campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryCampaign"
        "401":
          description: Authentication required
  /player/story/development/reset:
    post:
      operationId: resetPlayerStoryDevelopment
      tags: [player]
      summary: Development-only reset and optional story-node selector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryDevelopmentResetInput"
      responses:
        "200":
          description: Reset canonical story campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryCampaign"
        "401":
          description: Authentication required
        "404":
          description: Not available outside development
  /player/story/nodes/{nodeId}/complete:
    post:
      operationId: completePlayerStoryNode
      tags: [player]
      summary: Complete an available non-battle story node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryNodeCompleteInput"
      responses:
        "200":
          description: Updated story and player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryNodeCompletion"
        "400":
          description: Battle, puzzle, or otherwise invalid node completion
        "401":
          description: Authentication required
        "404":
          description: Story node not found
        "409":
          description: Locked node or conflicting idempotency key
  /player/story/puzzle:
    post:
      operationId: completePlayerStoryPuzzle
      tags: [player]
      summary: Solve or explicitly skip an available story puzzle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryPuzzleCompleteInput"
      responses:
        "200":
          description: Updated story and player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPuzzleCompletion"
        "400":
          description: Node has no puzzle or the solution is invalid
        "401":
          description: Authentication required
        "404":
          description: Story node not found
        "409":
          description: Locked node or conflicting idempotency key
  /player/story/nodes/{nodeId}/dialogue:
    post:
      operationId: savePlayerStoryDialogue
      tags: [player]
      summary: Persist dialogue history for an unlocked story node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryDialogueProgressInput"
      responses:
        "200":
          description: Updated dialogue history and canonical story state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryDialogueProgressResponse"
        "400":
          description: Invalid dialogue progress
        "401":
          description: Authentication required
        "409":
          description: Locked node or conflicting idempotency key
  /player/profile:
    patch:
      operationId: updatePlayerProfile
      tags: [player]
      summary: Update player-facing profile and settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerProfileUpdate"
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: Invalid profile update
        "401":
          description: Authentication required
  /player/onboarding:
    post:
      operationId: advancePlayerOnboarding
      tags: [player]
      summary: Advance one idempotent onboarding step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingProgressInput"
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: Invalid or out-of-order onboarding step
        "401":
          description: Authentication required
  /player/experiments/card:
    post:
      operationId: claimExperimentCard
      summary: Spend one earned experiment choice on an unowned Common
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardId]
              additionalProperties: false
              properties:
                cardId:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: Updated collection and remaining experiment choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "409":
          description: No earned choice is available or the card is already owned
  /player/matches:
    post:
      operationId: startPlayerMatch
      tags: [player]
      summary: Issue a server match session before local play starts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchStartInput"
      responses:
        "201":
          description: Match session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMatch"
        "400":
          description: Invalid match setup
        "401":
          description: Authentication required
  /player/matches/{matchId}/complete:
    post:
      operationId: completePlayerMatch
      tags: [player]
      summary: Complete a match once and receive server-computed rewards
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchCompleteInput"
      responses:
        "200":
          description: Match rewards and updated progression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchCompletion"
        "400":
          description: Invalid completion
        "401":
          description: Authentication required
        "404":
          description: Match not found
  /player/decks/{deckId}:
    put:
      operationId: savePlayerDeck
      tags: [player]
      summary: Save a named deck draft with server-side legality checks
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDeckInput"
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: Invalid deck draft
        "401":
          description: Authentication required
    delete:
      operationId: deletePlayerDeck
      tags: [player]
      summary: Delete a saved deck
      parameters:
        - name: deckId
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 80
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: The last legal deck cannot be deleted
        "401":
          description: Authentication required
  /player/packs/open:
    post:
      operationId: openPlayerPack
      tags: [player]
      summary: Open one Street Pack exactly once with published odds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenPackInput"
      responses:
        "200":
          description: Persisted pack result and updated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenPackResult"
        "400":
          description: Invalid payment or insufficient balance
        "401":
          description: Authentication required
  /player/collection/craft:
    post:
      operationId: craftPlayerVariant
      tags: [player]
      summary: Craft one visual card variant with Style Shards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CraftVariantInput"
      responses:
        "200":
          description: Updated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CraftVariantResult"
        "400":
          description: Unknown, locked, or unaffordable variant
        "401":
          description: Authentication required
  /player/collection/equip:
    put:
      operationId: equipPlayerVariant
      tags: [player]
      summary: Equip or remove one owned visual variant for a gameplay card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipVariantInput"
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: Unknown, mismatched, or unowned card variant
        "401":
          description: Authentication required
  /player/collection-road/{milestoneId}/claim:
    post:
      operationId: claimCollectionRoadMilestone
      tags: [player]
      summary: Claim a deterministic collection milestone exactly once
      parameters:
        - name: milestoneId
          in: path
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 48
      responses:
        "200":
          description: Persisted milestone reward and updated inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionRoadClaimResult"
        "400":
          description: Milestone is not claimable
        "401":
          description: Authentication required
        "404":
          description: Milestone not found
  /player/missions/{missionId}/claim:
    post:
      operationId: claimPlayerMission
      tags: [player]
      summary: Claim a completed mission exactly once
      parameters:
        - name: missionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated player state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerBootstrap"
        "400":
          description: Mission is not claimable
        "401":
          description: Authentication required
        "404":
          description: Mission not found
  /player/cosmetics:
    put:
      operationId: equipPlayerCosmetics
      summary: Save an owned banner, stickers, and character card scenes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CosmeticLoadout'
      responses:
        '200':
          description: Persisted cosmetic loadout and refreshed player state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerBootstrap'
        '400':
          description: Invalid or unowned cosmetic
        '401':
          description: Authentication required
  /player/shop:
    get:
      operationId: getPlayerShop
      summary: List earned-currency shop offers
      responses:
        '200':
          description: Versioned shop catalog
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /player/shop/purchases:
    post:
      operationId: purchasePlayerShopItem
      summary: Purchase training, move coaching, recruits, tickets, slots, or styles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopPurchaseInput'
      responses:
        '200':
          description: Persisted receipt and refreshed player state, also returned on an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopPurchaseResult'
        '400':
          description: Invalid purchase, insufficient currency, unowned character, or maximum upgrade
        '401':
          description: Authentication required
        '409':
          description: Request key reused with different input, or onboarding incomplete
  /player/promo-codes/redeem:
    post:
      operationId: redeemPlayerPromoCode
      summary: Redeem a promo code once per signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeInput'
      responses:
        '200':
          description: Saved reward receipt and refreshed balances; retries never grant rewards twice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResult'
        '400':
          description: Invalid or unavailable promo code
        '401':
          description: Authentication required
        '409':
          description: Finish Rookie Road before redeeming
  /player/payments/catalog:
    get:
      operationId: getPaymentCatalog
      tags: [player]
      summary: Get the current real-money payment catalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Payment catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCatalog"
        "400":
          description: Invalid payment request
        "401":
          description: Authentication required
        "403":
          description: Payments are not available for this player
        "404":
          description: Payment catalog not found
        "409":
          description: Payment state conflict
        "429":
          description: Too many payment requests
        "503":
          description: Payment provider unavailable
  /player/payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [player]
      summary: Create a checkout session for a catalog offer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCheckoutInput"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCheckout"
        "400":
          description: Invalid offer or idempotency key
        "401":
          description: Authentication required
        "403":
          description: Payments are not available for this player
        "404":
          description: Offer not found
        "409":
          description: Idempotency key conflicts with an existing checkout
        "429":
          description: Too many payment requests
        "503":
          description: Payment provider unavailable
  /player/payments/orders:
    get:
      operationId: listPaymentOrders
      tags: [player]
      summary: List the authenticated player's payment orders
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Payment order history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentHistory"
        "400":
          description: Invalid cursor
        "401":
          description: Authentication required
        "403":
          description: Payment history is not available for this player
        "404":
          description: Payment history not found
        "409":
          description: Payment state conflict
        "429":
          description: Too many payment requests
        "503":
          description: Payment provider unavailable
  /player/payments/orders/{orderId}:
    get:
      operationId: getPaymentOrder
      tags: [player]
      summary: Get one of the authenticated player's payment orders
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          description: Invalid order ID
        "401":
          description: Authentication required
        "403":
          description: This order does not belong to the authenticated player
        "404":
          description: Payment order not found
        "409":
          description: Payment state conflict
        "429":
          description: Too many payment requests
        "503":
          description: Payment provider unavailable
  /payments/webhook:
    post:
      operationId: receivePaymentWebhook
      summary: Receive a signed Stripe webhook
      description: >-
        Unauthenticated endpoint for Stripe. The Stripe-Signature header
        must be verified against the unmodified raw request body before parsing
        or processing the event. This endpoint intentionally does not define a
        request object shape. Redelivered events are acknowledged without regranting rewards.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe signature for the unmodified raw request body.
          schema:
            type: string
      responses:
        "200":
          description: Webhook accepted, including already processed events
        "400":
          description: Invalid webhook payload or missing/invalid signature
        "503":
          description: Payment provider processing unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PatchInput:
      type: object
      additionalProperties: false
      required: [version, title, date, overview, buffs, changes]
      properties:
        version: { type: string, minLength: 1, maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 120 }
        date: { type: string, minLength: 10, maxLength: 10, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        overview: { type: string, minLength: 1, maxLength: 3000 }
        buffs: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 500 } }
        changes: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 500 } }
        softCurrency: { type: integer, minimum: 0, maximum: 100, default: 50 }
        packTickets: { type: integer, minimum: 0, maximum: 1, default: 0 }
        artCardId:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Catalog character whose original artwork headlines this patch.
    PatchPublishInput:
      type: object
      additionalProperties: false
      required: [confirmVersion]
      properties:
        confirmVersion: { type: string, minLength: 1, maxLength: 64 }
    PublicPatch:
      type: object
      additionalProperties: false
      required: [version, title, date, overview, buffs, changes, artCardId, publishedAt, mailStatus]
      properties:
        version: { type: string }
        artCardId: { type: [string, 'null'] }
        title: { type: string, maxLength: 120 }
        date: { type: string, minLength: 10, maxLength: 10, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        overview: { type: string }
        buffs: { type: array, items: { type: string } }
        changes: { type: array, items: { type: string } }
        publishedAt: { type: string, format: date-time }
        mailStatus: { type: string, enum: [delivering, partial, complete] }
    AdminPatch:
      allOf:
        - $ref: '#/components/schemas/PatchInput'
        - type: object
          required: [version, title, date, overview, buffs, changes, softCurrency, packTickets, artCardId, id, status, createdAt, updatedAt, createdBy, publishedBy, intendedCount, deliveredCount, failedCount, lastError, campaignId]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, published] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            createdBy: { type: string }
            publishedBy: { type: [string, 'null'] }
            intendedCount: { type: integer, minimum: 0 }
            deliveredCount: { type: integer, minimum: 0 }
            failedCount: { type: integer, minimum: 0 }
            lastError: { type: [string, 'null'] }
            campaignId: { type: [string, 'null'] }
    PatchLetter:
      type: object
      additionalProperties: false
      required: [id, title, body, sender, gift]
      properties:
        id: { type: string, maxLength: 100 }
        title: { type: string, maxLength: 120 }
        body: { type: string }
        sender: { type: string }
        gift:
          type: object
          additionalProperties: false
          required: [softCurrency, packTickets, styleShards]
          properties:
            softCurrency: { type: integer, minimum: 0, maximum: 100 }
            packTickets: { type: integer, minimum: 0, maximum: 1 }
            styleShards: { type: integer, const: 0 }
    PatchPreview:
      type: object
      additionalProperties: false
      required: [patch, letter, audienceCount]
      properties:
        patch: { $ref: '#/components/schemas/AdminPatch' }
        letter: { $ref: '#/components/schemas/PatchLetter' }
        audienceCount: { type: integer, minimum: 0 }
    EventFeedbackCategory:
      type: string
      enum: [bug, suggestion, general]
    EventFeedbackInput:
      type: object
      additionalProperties: false
      required: [category, message, retryId]
      properties:
        category: { $ref: '#/components/schemas/EventFeedbackCategory' }
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text only. Trimmed by the server; whitespace-only input is rejected.
        retryId:
          type: string
          format: uuid
          description: Client-created identifier reused for retries of this submission.
    EventFeedbackPost:
      type: object
      additionalProperties: false
      required: [id, displayName, category, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, description: Public in-game name at the time of posting, never an account ID or email }
        category: { $ref: '#/components/schemas/EventFeedbackCategory' }
        message: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    EventFeedbackPage:
      type: object
      additionalProperties: false
      required: [posts, nextCursor]
      properties:
        posts:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/EventFeedbackPost' }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
    EventFeedbackReceipt:
      type: object
      additionalProperties: false
      required: [post, receiptId, replayed]
      properties:
        post: { $ref: '#/components/schemas/EventFeedbackPost' }
        receiptId:
          type: string
          format: uuid
          description: The saved post ID; unchanged on retries.
        replayed: { type: boolean }
    FeedbackError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
        retryAfterSeconds: { type: integer, minimum: 1 }
    SocialPlayer:
      type: object
      required: [friendCode, displayName, avatarKey, username, lastActiveAt]
      properties:
        username: { type: string }
        lastActiveAt: { type: string, nullable: true }
        friendCode: { type: string }
        displayName: { type: string }
        avatarKey: { type: string }
    SocialRequest:
      type: object
      required: [id, player, createdAt]
      properties:
        id: { type: string }
        player: { $ref: '#/components/schemas/SocialPlayer' }
        createdAt: { type: string }
    SocialInvitation:
      type: object
      required: [id, roomCode, direction, player, status, expiresAt]
      properties:
        id: { type: string }
        roomCode: { type: string }
        direction: { type: string, enum: [incoming, outgoing] }
        player: { $ref: '#/components/schemas/SocialPlayer' }
        status: { type: string, enum: [pending, accepted, declined, cancelled, expired, unavailable, closed] }
        expiresAt: { type: string }
    SocialState:
      type: object
      required: [self, homies, incomingRequests, outgoingRequests, blocked, invitations, counts]
      properties:
        self: { $ref: '#/components/schemas/SocialPlayer' }
        homies: { type: array, items: { $ref: '#/components/schemas/SocialPlayer' } }
        incomingRequests: { type: array, items: { $ref: '#/components/schemas/SocialRequest' } }
        outgoingRequests: { type: array, items: { $ref: '#/components/schemas/SocialRequest' } }
        blocked: { type: array, items: { $ref: '#/components/schemas/SocialPlayer' } }
        invitations: { type: array, items: { $ref: '#/components/schemas/SocialInvitation' } }
        counts:
          type: object
          required: [requests, invitations]
          properties:
            requests: { type: integer }
            invitations: { type: integer }
    SocialLookup:
      type: object
      required: [player, relationship, requestId]
      properties:
        requestId: { type: string, nullable: true }
        player: { $ref: '#/components/schemas/SocialPlayer' }
        relationship: { type: string, enum: [none, incoming, outgoing, homie, blocked, self] }
    SocialSearchResult:
      type: object
      required: [players]
      properties:
        players: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/SocialLookup' } }
    SocialMatchOpponent:
      type: object
      required: [opponent]
      properties:
        opponent:
          allOf: [{ $ref: '#/components/schemas/SocialLookup' }]
          nullable: true
    SocialUsernameInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
    SocialCodeInput:
      type: object
      additionalProperties: false
      required: [friendCode]
      properties:
        friendCode: { type: string, minLength: 1, maxLength: 32 }
    SocialResponseInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, cancel] }
    FadeInvitationInput:
      type: object
      additionalProperties: false
      required: [friendCode, deckId, requestId]
      properties:
        friendCode: { type: string, minLength: 1, maxLength: 32 }
        deckId: { type: string, minLength: 1, maxLength: 100 }
        requestId: { type: string, format: uuid }
    FadeInvitationResponseInput:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, cancel] }
        deckId: { type: string, minLength: 1, maxLength: 100 }
    PaymentCheckoutInput:
      type: object
      additionalProperties: false
      required: [offerId, idempotencyKey]
      properties:
        adultConfirmed:
          type: boolean
          description: Must be true for a new checkout. Self-attestation of age 18 or older, not verified age. Optional only for retries of existing orders.
        unitedStatesConfirmed:
          type: boolean
          description: Must be true for a new checkout. Self-declaration of US location, not verified geography. Optional only for retries of existing orders.
        offerId:
          type: string
          enum: [clout-pocket, clout-stack, clout-bag]
        idempotencyKey:
          type: string
          format: uuid
    PaymentCatalog:
      type: object
      required: [version, taxMode, mode, enabled, message, supportUrl, refundPolicyUrl, offers]
      properties:
        taxMode:
          type: string
          enum: [none, automatic]
        version:
          type: string
        mode:
          type: string
          enum: [disabled, test, live]
        enabled:
          type: boolean
        message:
          type: string
        supportUrl:
          type: [string, "null"]
        refundPolicyUrl:
          type: [string, "null"]
        offers:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOffer"
    PaymentOffer:
      type: object
      required: [id, name, amountMinor, currency, clout, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        clout:
          type: integer
        enabled:
          type: boolean
    PaymentCheckout:
      type: object
      required: [order, checkoutUrl]
      properties:
        order:
          $ref: "#/components/schemas/PaymentOrder"
        checkoutUrl:
          type: [string, "null"]
    PaymentHistory:
      type: object
      required: [orders, nextCursor]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/PaymentOrder"
        nextCursor:
          type: [string, "null"]
    PaymentOrder:
      type: object
      required: [id, offerId, offerName, mode, currency, amountMinor, taxMode, taxAmountMinor, totalAmountMinor, clout, status, createdAt, fulfilledAt, refundedAmountMinor, checkoutUrl]
      properties:
        taxMode:
          type: string
          enum: [none, automatic]
        taxAmountMinor:
          type: [integer, "null"]
        totalAmountMinor:
          type: [integer, "null"]
        id:
          type: string
        offerId:
          type: string
        offerName:
          type: string
        mode:
          type: string
          enum: [test, live]
        currency:
          type: string
        amountMinor:
          type: integer
        clout:
          type: integer
        status:
          type: string
          enum: [pending, processing, fulfilled, failed, expired, refunded, disputed]
        createdAt:
          type: string
          format: date-time
        fulfilledAt:
          type: [string, "null"]
          format: date-time
        refundedAmountMinor:
          type: integer
        checkoutUrl:
          type: [string, "null"]
    ChallengeStartInput:
      type: object
      additionalProperties: false
      properties:
        deckId: { type: string, maxLength: 80 }
    ChallengeAction:
      type: object
      additionalProperties: false
      properties:
        matchId: { type: string, format: uuid }
        moves: { type: array, items: {} }
        outcome: { type: string, enum: [win, loss, draw] }
        nextMatchId: { type: string, format: uuid }
      required: [matchId, moves, outcome]
    ChallengeRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, settled, abandoned] }
        seed: { type: integer }
        encounterIndex: { type: integer }
        score: { type: integer }
        wins: { type: integer }
        entryDate: { type: string, format: date }
        entryNumber: { type: integer, enum: [1, 2] }
        crew: { type: object, additionalProperties: true }
        encounter: { type: object, additionalProperties: true }
        checkpoints: { type: array, items: { type: object, additionalProperties: true } }
        recovery:
          type: [object, "null"]
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
      required: [id, status, seed, encounterIndex, score, wins, entryDate, entryNumber, crew, encounter, checkpoints, createdAt, completedAt]
    PromoCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
    PromoCodeReceipt:
      type: object
      required: [code, packTickets, softCurrency, styleShards]
      properties:
        code:
          type: string
        packTickets:
          type: integer
          minimum: 0
        softCurrency:
          type: integer
          minimum: 0
        styleShards:
          type: integer
          minimum: 0
        cardIds:
          type: array
          items:
            type: string
    PromoCodeResult:
      type: object
      required: [receipt, alreadyRedeemed, bootstrap]
      properties:
        receipt:
          $ref: '#/components/schemas/PromoCodeReceipt'
        alreadyRedeemed:
          type: boolean
        bootstrap:
          $ref: '#/components/schemas/PlayerBootstrap'
    ShopPurchaseInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, itemId]
      properties:
        idempotencyKey:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        itemId:
          type: string
          enum: [training, training-intensive, move-training, ticket, deck-slot, common-recruit, tagged-style, chrome-style, character-stickers, character-backdrop, character-banner-finish, reaction-pack, reaction-pack:big-city-pigeon:v1, reaction-pack:dr-fade:v1, reaction-pack:buddy:v1, reaction-pack:ashlee:v1, reaction-pack:buttahs:v1, reaction-pack:guap:v1, reaction-pack:cologne-criminal:v1, reaction-pack:kyle:v1, reaction-pack:church-auntie:v1]
        cardId:
          type: string
          minLength: 1
          maxLength: 100
    ShopPurchaseResult:
      type: object
      required: [receipt, alreadyPurchased, bootstrap]
      properties:
        receipt:
          type: object
          required: [itemId, cardId, cost, currency, summary]
          properties:
            itemId:
              type: string
            cardId:
              type: string
              nullable: true
            cost:
              type: integer
            currency:
              type: string
              enum: [softCurrency, styleShards]
            summary:
              type: string
        alreadyPurchased:
          type: boolean
        bootstrap:
          $ref: '#/components/schemas/PlayerBootstrap'
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DeploymentIdentity:
      type: object
      properties:
        environment:
          type: string
          enum: [production, staging]
        context:
          type: string
          enum: [production, deploy-preview, branch-deploy, staging]
        deployId:
          type: string
        origin:
          type: string
          format: uri
        databaseFingerprint:
          type: string
          pattern: "^[a-f0-9]{16}$"
        clerkEnvironment:
          type: string
          enum: [live, test]
      required: [environment, context, deployId, origin, databaseFingerprint, clerkEnvironment]
    CosmeticLoadout:
      type: object
      additionalProperties: false
      properties:
        bannerCardId:
          type: [string, "null"]
          maxLength: 64
        bannerFinish:
          type: string
          enum: [base, silver]
        stickers:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            maxLength: 80
        cardBackgrounds:
          type: object
          maxProperties: 200
          additionalProperties:
            type: string
            enum: [blue-hour]
    PlayerSettings:
      type: object
      properties:
        cosmetics:
          $ref: "#/components/schemas/CosmeticLoadout"
        reactionTray:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
        reducedMotion:
          type: boolean
        turnTimerEnabled:
          type: boolean
      required: [reducedMotion, turnTimerEnabled]
    SavedDeck:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cardIds:
          type: array
          items:
            type: string
        heroCardId:
          type: string
        recipeId:
          type: [string, "null"]
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: string
      required: [id, name, cardIds, heroCardId, recipeId, valid, issues]
    SaveDeckInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 32
        cardIds:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64
        heroCardId:
          type: string
          maxLength: 64
        recipeId:
          type: [string, "null"]
          maxLength: 32
      required: [name, cardIds, heroCardId, recipeId]
      additionalProperties: false
    StyleShardBalances:
      type: object
      description: Matching rarity currencies. Super Common uses Common. Absent balances are zero; styleShards remains universal.
      properties:
        Common:
          type: integer
          minimum: 0
