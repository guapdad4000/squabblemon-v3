[build]
  command = "node scripts/build-netlify.mjs"
  publish = "artifacts/squabblemon/dist/public"

[database.migrations]
  path = "netlify/database/migrations"

[build.environment]
  NODE_VERSION = "24"
  PORT = "5173"
  BASE_PATH = "/"
  NODE_ENV = "production"

[context.production.environment]
  APP_ENV = "production"

[context.deploy-preview.environment]
  APP_ENV = "staging"

[context.branch-deploy.environment]
  APP_ENV = "staging"

[context.staging.environment]
  APP_ENV = "staging"

[functions]
  directory = "artifacts/api-server/dist/netlify-functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
